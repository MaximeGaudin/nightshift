[install]
# bun-plugin-tailwind peer-depends on "bun"; installing it would shadow the runtime in `bun run` scripts.
peer = false

[serve.static]
plugins = ["bun-plugin-tailwind"]

[test]
preload = ["./test/preload.ts"]
# Default is 5000 ms, shorter than waitFor's 8000 ms: a slow file watcher under load killed the test with no message.
timeout = 15000
