<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nightshift — aperçu du logo</title>
<style>
body{margin:0;font-family:system-ui,sans-serif}
.panel{padding:24px 32px}
.light{background:#fbfbfc;color:#14151a}
.dark{background:#0e0f12;color:#e8e9ec}
h2{margin:0 0 16px;font-size:20px}
h3{margin:0 0 8px;font-size:14px;font-weight:600}
.row{margin-bottom:20px}
.sizes{display:flex;align-items:flex-end;gap:32px}
figure{margin:0;display:flex;flex-direction:column;align-items:flex-start;gap:6px}
figcaption{font-size:12px;opacity:.7}
img{display:block}
.mock{display:flex;align-items:center;gap:8px;margin:0;font-family:system-ui;font-size:16px}
</style>
</head>
<body>
<section class="panel light">
<h2>Fond clair (#fbfbfc)</h2>
<div class="row">
<h3>Variante 1 — Colonnes</h3>
<div class="sizes">
<figure><img src="variant-1.svg" width="16" height="16" alt="Variante 1 — Colonnes à 16 px"><figcaption>16 px</figcaption></figure>
<figure><img src="variant-1.svg" width="20" height="20" alt="Variante 1 — Colonnes à 20 px"><figcaption>20 px</figcaption></figure>
<figure><img src="variant-1.svg" width="32" height="32" alt="Variante 1 — Colonnes à 32 px"><figcaption>32 px</figcaption></figure>
<figure><img src="variant-1.svg" width="128" height="128" alt="Variante 1 — Colonnes à 128 px"><figcaption>128 px</figcaption></figure>
</div>
</div>
<div class="row">
<h3>Variante 2 — Cartes en découpe</h3>
<div class="sizes">
<figure><img src="variant-2.svg" width="16" height="16" alt="Variante 2 — Cartes en découpe à 16 px"><figcaption>16 px</figcaption></figure>
<figure><img src="variant-2.svg" width="20" height="20" alt="Variante 2 — Cartes en découpe à 20 px"><figcaption>20 px</figcaption></figure>
<figure><img src="variant-2.svg" width="32" height="32" alt="Variante 2 — Cartes en découpe à 32 px"><figcaption>32 px</figcaption></figure>
<figure><img src="variant-2.svg" width="128" height="128" alt="Variante 2 — Cartes en découpe à 128 px"><figcaption>128 px</figcaption></figure>
</div>
</div>
<div class="row">
<h3>Variante 3 — Escalier</h3>
<div class="sizes">
<figure><img src="variant-3.svg" width="16" height="16" alt="Variante 3 — Escalier à 16 px"><figcaption>16 px</figcaption></figure>
<figure><img src="variant-3.svg" width="20" height="20" alt="Variante 3 — Escalier à 20 px"><figcaption>20 px</figcaption></figure>
<figure><img src="variant-3.svg" width="32" height="32" alt="Variante 3 — Escalier à 32 px"><figcaption>32 px</figcaption></figure>
<figure><img src="variant-3.svg" width="128" height="128" alt="Variante 3 — Escalier à 128 px"><figcaption>128 px</figcaption></figure>
</div>
</div>
<div class="row">
<h3>Contexte, 20 px</h3>
<p class="mock"><img src="variant-1.svg" width="20" height="20" alt="Logo Nightshift"><span>Nightshift</span></p>
</div>
</section>
<section class="panel dark">
<h2>Fond sombre (#0e0f12)</h2>
<div class="row">
<h3>Variante 1 — Colonnes</h3>
<div class="sizes">
<figure><img src="variant-1.svg" width="16" height="16" alt="Variante 1 — Colonnes à 16 px"><figcaption>16 px</figcaption></figure>
<figure><img src="variant-1.svg" width="20" height="20" alt="Variante 1 — Colonnes à 20 px"><figcaption>20 px</figcaption></figure>
<figure><img src="variant-1.svg" width="32" height="32" alt="Variante 1 — Colonnes à 32 px"><figcaption>32 px</figcaption></figure>
<figure><img src="variant-1.svg" width="128" height="128" alt="Variante 1 — Colonnes à 128 px"><figcaption>128 px</figcaption></figure>
</div>
</div>
<div class="row">
<h3>Variante 2 — Cartes en découpe</h3>
<div class="sizes">
<figure><img src="variant-2.svg" width="16" height="16" alt="Variante 2 — Cartes en découpe à 16 px"><figcaption>16 px</figcaption></figure>
<figure><img src="variant-2.svg" width="20" height="20" alt="Variante 2 — Cartes en découpe à 20 px"><figcaption>20 px</figcaption></figure>
<figure><img src="variant-2.svg" width="32" height="32" alt="Variante 2 — Cartes en découpe à 32 px"><figcaption>32 px</figcaption></figure>
<figure><img src="variant-2.svg" width="128" height="128" alt="Variante 2 — Cartes en découpe à 128 px"><figcaption>128 px</figcaption></figure>
</div>
</div>
<div class="row">
<h3>Variante 3 — Escalier</h3>
<div class="sizes">
<figure><img src="variant-3.svg" width="16" height="16" alt="Variante 3 — Escalier à 16 px"><figcaption>16 px</figcaption></figure>
<figure><img src="variant-3.svg" width="20" height="20" alt="Variante 3 — Escalier à 20 px"><figcaption>20 px</figcaption></figure>
<figure><img src="variant-3.svg" width="32" height="32" alt="Variante 3 — Escalier à 32 px"><figcaption>32 px</figcaption></figure>
<figure><img src="variant-3.svg" width="128" height="128" alt="Variante 3 — Escalier à 128 px"><figcaption>128 px</figcaption></figure>
</div>
</div>
<div class="row">
<h3>Contexte, 20 px</h3>
<p class="mock"><img src="variant-1.svg" width="20" height="20" alt="Logo Nightshift"><span>Nightshift</span></p>
</div>
</section>
</body>
</html>
